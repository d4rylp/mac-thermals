name: MacThermals

options:
  bundleIdPrefix: io.github.d4rylp
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ThermalKit:
    path: Packages/ThermalKit

settings:
  base:
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MacThermals:
    type: application
    platform: macOS
    sources:
      - App
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: ThermalKit
        product: ThermalCore
      - package: ThermalKit
        product: ThermalPlatform
      - package: ThermalKit
        product: ThermalUI
    settings:
      base:
        PRODUCT_NAME: Mac Thermals
        PRODUCT_BUNDLE_IDENTIFIER: io.github.d4rylp.MacThermals
        PRODUCT_MODULE_NAME: MacThermals
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: App/MacThermals.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mac Thermals
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Daryl. MIT License.

  MacThermalsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - target: MacThermals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.d4rylp.MacThermalsTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mac Thermals.app/Contents/MacOS/Mac Thermals
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  MacThermals:
    build:
      targets:
        MacThermals: all
        MacThermalsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacThermalsTests
        - package: ThermalKit/ThermalCoreTests
        - package: ThermalKit/ThermalPlatformTests
        - package: ThermalKit/ThermalUITests
    archive:
      config: Release
